<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIU Exam Routine</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="student-page">

<header class="student-header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-logo">DIU</div>
      <div>
        <p class="brand-eyebrow">Daffodil International University</p>
        <h1 class="brand-title">DIU Exam Routine</h1>
      </div>
    </div>
    <nav><a href="/admin.html" class="header-nav-link">Admin</a></nav>
  </div>
</header>

<main class="wrap">

  <section class="search-panel">
    <form id="search-form" class="search-form">
      <div class="search-field">
        <label for="section">Select your section</label>
        <div class="combo" id="section-combo">
          <input type="text" id="section" class="combo-input" placeholder="Type section e.g. 64_M"
                 autocomplete="off" spellcheck="false" required>
          <div id="section-list" class="combo-list" role="listbox"></div>
        </div>
        <p class="combo-error" id="section-error" style="display:none;">Please select a valid section, e.g. 64_M</p>
      </div>
      <button type="submit" class="search-btn">
        <span class="search-btn-text">Find My Exams</span>
        <span class="search-btn-arrow">&rarr;</span>
      </button>
    </form>
  </section>

  <section id="countdown-hero" class="countdown-hero" style="display:none;">
    <p class="countdown-label">Next Exam</p>
    <h2 id="countdown-course" class="countdown-course"></h2>
    <p id="countdown-meta" class="countdown-meta"></p>
    <div id="countdown-timer" class="countdown-timer"></div>
  </section>

  <section id="results-panel" style="display:none;">
    <div id="day-picker" class="day-picker"></div>
    <div id="results-body" class="exam-list"></div>
  </section>

</main>

<footer class="site-footer">DIU Exam Routine &middot; <a href="/admin.html">Admin panel</a></footer>

<script src="/js/student.js"></script>
</body>
</html>
