<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIU Exam Routine</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="student-page">

<header class="student-header">
  <div class="header-inner">
    <div class="header-brand">
      <img src="/logo.png" alt="Daffodil International University" class="header-logo-img">
      <h1 class="brand-title">DIU Exam Routine</h1>
    </div>
    <nav class="header-nav">
      <button id="menu-toggle" class="menu-btn" aria-label="Open menu" aria-expanded="false">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
      </button>
    </nav>
  </div>
  <div id="site-menu" class="site-menu" hidden>
    <a href="/admin.html" class="site-menu-item"><svg class="site-menu-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Admin Login</a>
    <button type="button" id="theme-toggle" class="site-menu-item"><svg class="site-menu-icon icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="site-menu-icon icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span id="theme-label">Bright Mode</span></button>
  </div>
</header>

<main class="wrap">

  <section class="search-panel">
    <form id="search-form" class="search-form">
      <div class="search-field">
        <label for="section">Select your section</label>
        <div class="combo" id="section-combo">
          <input type="text" id="section" class="combo-input" placeholder="Type section e.g. 64_M"
                 autocomplete="off" spellcheck="false" required>
          <div id="section-list" class="combo-list" role="listbox"></div>
        </div>
        <p class="combo-error" id="section-error" style="display:none;">Please select a valid section, e.g. 64_M</p>
      </div>
      <button type="submit" class="search-btn">
        <span class="search-btn-text">Find My Exams</span>
        <span class="search-btn-arrow">&rarr;</span>
      </button>
    </form>
  </section>

  <section id="countdown-hero" class="countdown-hero" style="display:none;">
    <p class="countdown-label">Next Exam</p>
    <h2 id="countdown-course" class="countdown-course"></h2>
    <p id="countdown-meta" class="countdown-meta"></p>
    <div id="countdown-timer" class="countdown-timer"></div>
  </section>

  <section id="results-panel" style="display:none;">
    <div id="day-picker" class="day-picker"></div>
    <div id="results-body" class="exam-list"></div>
  </section>

</main>

<footer class="site-footer">DIU Exam Routine &middot; <a href="/admin.html">Admin panel</a></footer>

<script src="/js/student.js"></script>
</body>
</html>
